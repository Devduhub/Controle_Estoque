<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;family=Share+Tech+Mono&amp;display=swap');
    </style>
    <radialGradient id="vign" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="#0a0a0f"/>

  <!-- Hex grid pattern -->
  <g stroke="#00ff88" stroke-opacity="0.04" stroke-width="0.5" fill="none">
    <!-- row 0 -->
    <polygon points="60,10 86,25 86,55 60,70 34,55 34,25"/>
    <polygon points="112,10 138,25 138,55 112,70 86,55 86,25"/>
    <polygon points="164,10 190,25 190,55 164,70 138,55 138,25"/>
    <polygon points="216,10 242,25 242,55 216,70 190,55 190,25"/>
    <polygon points="268,10 294,25 294,55 268,70 242,55 242,25"/>
    <polygon points="320,10 346,25 346,55 320,70 294,55 294,25"/>
    <polygon points="372,10 398,25 398,55 372,70 346,55 346,25"/>
    <polygon points="424,10 450,25 450,55 424,70 398,55 398,25"/>
    <polygon points="476,10 502,25 502,55 476,70 450,55 450,25"/>
    <polygon points="528,10 554,25 554,55 528,70 502,55 502,25"/>
    <polygon points="580,10 606,25 606,55 580,70 554,55 554,25"/>
    <polygon points="632,10 658,25 658,55 632,70 606,55 606,25"/>
    <polygon points="684,10 710,25 710,55 684,70 658,55 658,25"/>
    <polygon points="736,10 762,25 762,55 736,70 710,55 710,25"/>
    <polygon points="788,10 814,25 814,55 788,70 762,55 762,25"/>
    <polygon points="840,10 866,25 866,55 840,70 814,55 814,25"/>
    <polygon points="892,10 918,25 918,55 892,70 866,55 866,25"/>
    <polygon points="944,10 970,25 970,55 944,70 918,55 918,25"/>
    <polygon points="996,10 1022,25 1022,55 996,70 970,55 970,25"/>
    <polygon points="1048,10 1074,25 1074,55 1048,70 1022,55 1022,25"/>
    <polygon points="1100,10 1126,25 1126,55 1100,70 1074,55 1074,25"/>
    <polygon points="1152,10 1178,25 1178,55 1152,70 1126,55 1126,25"/>
    <polygon points="1204,10 1230,25 1230,55 1204,70 1178,55 1178,25"/>
    <!-- row 1 -->
    <polygon points="34,55 60,70 60,100 34,115 8,100 8,70"/>
    <polygon points="86,55 112,70 112,100 86,115 60,100 60,70"/>
    <polygon points="138,55 164,70 164,100 138,115 112,100 112,70"/>
    <polygon points="190,55 216,70 216,100 190,115 164,100 164,70"/>
    <polygon points="242,55 268,70 268,100 242,115 216,100 216,70"/>
    <polygon points="1090,55 1116,70 1116,100 1090,115 1064,100 1064,70"/>
    <polygon points="1142,55 1168,70 1168,100 1142,115 1116,100 1116,70"/>
    <polygon points="1194,55 1220,70 1220,100 1194,115 1168,100 1168,70"/>
    <!-- row 2 -->
    <polygon points="60,100 86,115 86,145 60,160 34,145 34,115"/>
    <polygon points="112,100 138,115 138,145 112,160 86,145 86,115"/>
    <polygon points="164,100 190,115 190,145 164,160 138,145 138,115"/>
    <polygon points="1090,100 1116,115 1116,145 1090,160 1064,145 1064,115"/>
    <polygon points="1142,100 1168,115 1168,145 1142,160 1116,145 1116,115"/>
    <polygon points="1194,100 1220,115 1220,145 1194,160 1168,145 1168,115"/>
    <!-- bottom rows -->
    <polygon points="60,290 86,305 86,335 60,350 34,335 34,305"/>
    <polygon points="112,290 138,305 138,335 112,350 86,335 86,305"/>
    <polygon points="164,290 190,305 190,335 164,350 138,335 138,305"/>
    <polygon points="216,290 242,305 242,335 216,350 190,335 190,305"/>
    <polygon points="1090,290 1116,305 1116,335 1090,350 1064,335 1064,305"/>
    <polygon points="1142,290 1168,305 1168,335 1142,350 1116,335 1116,305"/>
    <polygon points="1194,290 1220,305 1220,335 1194,350 1168,335 1168,305"/>
  </g>

  <!-- Grid lines -->
  <g stroke="#00ff88" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="0" y1="40" x2="1280" y2="40"/>
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
  </g>

  <!-- Scatter particles -->
  <circle cx="180" cy="60" r="1.5" fill="#00ff88" opacity="0.35"/>
  <circle cx="340" cy="130" r="1" fill="#44aaff" opacity="0.4"/>
  <circle cx="520" cy="80" r="2" fill="#00ff88" opacity="0.2"/>
  <circle cx="750" cy="50" r="1" fill="#ff4466" opacity="0.45"/>
  <circle cx="900" cy="110" r="1.5" fill="#44aaff" opacity="0.3"/>
  <circle cx="1050" cy="70" r="1" fill="#00ff88" opacity="0.4"/>
  <circle cx="1200" cy="140" r="2" fill="#ff4466" opacity="0.25"/>
  <circle cx="200" cy="320" r="1.5" fill="#44aaff" opacity="0.3"/>
  <circle cx="450" cy="350" r="1" fill="#00ff88" opacity="0.35"/>
  <circle cx="1100" cy="330" r="2" fill="#00ff88" opacity="0.2"/>
  <circle cx="80" cy="200" r="1" fill="#ff4466" opacity="0.4"/>
  <circle cx="1240" cy="260" r="1.5" fill="#44aaff" opacity="0.35"/>

  <!-- Matrix rain effect (static representation) -->
  <g font-family="Share Tech Mono, monospace" font-size="11" fill="#00ff88" opacity="0.08">
    <text x="30" y="30">A</text><text x="30" y="44">F</text><text x="30" y="58">3</text><text x="30" y="72">9</text>
    <text x="48" y="50">B</text><text x="48" y="64">2</text><text x="48" y="78">E</text>
    <text x="1210" y="40">7</text><text x="1210" y="54">C</text><text x="1210" y="68">1</text>
    <text x="1228" y="30">D</text><text x="1228" y="44">8</text><text x="1228" y="58">F</text><text x="1228" y="72">4</text>
    <text x="50" y="340">0</text><text x="50" y="354">A</text><text x="50" y="368">9</text>
    <text x="1210" y="320">3</text><text x="1210" y="334">E</text><text x="1210" y="348">B</text>
  </g>

  <!-- Glow center -->
  <rect x="0" y="0" width="1280" height="400" fill="url(#glow)"/>

  <!-- Vignette -->
  <rect x="0" y="0" width="1280" height="400" fill="url(#vign)"/>

  <!-- Corner brackets -->
  <g stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.8">
    <polyline points="16,40 16,16 40,16"/>
    <polyline points="1240,16 1264,16 1264,40"/>
    <polyline points="16,360 16,384 40,384"/>
    <polyline points="1240,384 1264,384 1264,360"/>
  </g>

  <!-- Status dot + text -->
  <circle cx="1230" cy="24" r="4" fill="#00ff88">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="1218" y="20" font-family="Share Tech Mono, monospace" font-size="9" fill="#00ff88" opacity="0.6" text-anchor="end">ONLINE</text>

  <!-- Scan line -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#scanGrad)" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,400" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Badge -->
  <text x="640" y="148" font-family="Share Tech Mono, monospace" font-size="13" fill="#00ff88" opacity="0.75" text-anchor="middle" letter-spacing="5">// SISTEMA DE CONTROLE v3.0</text>

  <!-- Main title -->
  <text x="640" y="218" font-family="Orbitron, monospace" font-size="62" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#textglow)" letter-spacing="4">BOT ANTISHOCK</text>
  <text x="640" y="272" font-family="Orbitron, monospace" font-size="44" font-weight="900" fill="#00ff88" text-anchor="middle" filter="url(#textglow)" letter-spacing="8">ESTOQUE</text>

  <!-- Subtitle -->
  <text x="640" y="308" font-family="Share Tech Mono, monospace" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="4">AUTOMAÇÃO · NLP · TELEGRAM · MAKE · OPENAI WHISPER</text>

  <!-- Chips -->
  <g font-family="Share Tech Mono, monospace" font-size="11" letter-spacing="1">
    <!-- Python -->
    <rect x="312" y="326" width="90" height="22" rx="4" fill="rgba(0,255,136,0.06)" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="357" y="341" fill="#00ff88" text-anchor="middle">Python 3.11</text>
    <!-- Telegram -->
    <rect x="412" y="326" width="104" height="22" rx="4" fill="rgba(68,170,255,0.06)" stroke="#44aaff" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="464" y="341" fill="#44aaff" text-anchor="middle">Telegram Bot</text>
    <!-- Whisper -->
    <rect x="526" y="326" width="116" height="22" rx="4" fill="rgba(0,255,136,0.06)" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="584" y="341" fill="#00ff88" text-anchor="middle">OpenAI Whisper</text>
    <!-- R$ 100k -->
    <rect x="652" y="326" width="128" height="22" rx="4" fill="rgba(255,68,102,0.06)" stroke="#ff4466" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="716" y="341" fill="#ff4466" text-anchor="middle">R$ 100k/mês salvo</text>
    <!-- Make -->
    <rect x="790" y="326" width="116" height="22" rx="4" fill="rgba(68,170,255,0.06)" stroke="#44aaff" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="848" y="341" fill="#44aaff" text-anchor="middle">Make Automation</text>
  </g>

  <!-- Horizontal divider lines -->
  <line x1="200" y1="370" x2="540" y2="370" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.2"/>
  <circle cx="640" cy="370" r="3" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.4"/>
  <line x1="740" y1="370" x2="1080" y2="370" stroke="#00ff88" stroke-width="0.5" stroke-opacity="0.2"/>
</svg>
